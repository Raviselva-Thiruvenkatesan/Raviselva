<section class="hero min-vh-100 d-flex align-items-center position-relative">
  <div class="container">
    <div class="row align-items-center">
      <!-- Left Content -->
      <div class="col-lg-6 mb-5 mb-lg-0 text-center text-lg-start" appScrollReveal="reveal-right">
        <span class="greeting d-inline-block mb-3 px-3 py-1 rounded-pill">Hello World, I'm</span>
        <h1 class="display-3 fw-bold mb-3">
          Raviselva
          <span class="text-gradient">Thiruvenkatesan</span>
        </h1>
        <h2 class="h3 fw-normal mb-4 text-muted">
          I am a <span class="typing-text text-gradient fw-bold">{{ currentRole }}<span class="cursor">|</span></span>
        </h2>
        <p class="lead mb-5 max-w-lg mx-auto mx-lg-0">
          Passionate software engineer specializing in .NET development, Angular, SQL Server, and modern web
          technologies. Focused on building scalable applications with clean UI and efficient architecture.
        </p>
        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center justify-content-lg-start">
          <a href="#projects" class="btn-magnetic btn-primary-custom">
            View Projects
            <i class="bi bi-arrow-right ms-2"></i>
          </a>
          <a href="#contact" class="btn-magnetic btn-outline-custom">
            Contact Me
          </a>
        </div>
      </div>

      <!-- Right Content (Image & Floating Icons) -->
      <div class="col-lg-6" appScrollReveal="reveal-left">
        <div class="profile-container position-relative mx-auto">
          <!-- Floating Icons -->
          <div class="floating-icon icon-angular"><i class="bi bi-browser-chrome"></i></div>
          <div class="floating-icon icon-dotnet"><i class="bi bi-braces"></i></div>
          <div class="floating-icon icon-sql"><i class="bi bi-database"></i></div>

          <div class="profile-image-wrapper">
            <!-- Placeholder for Profile Image -->
            <div class="profile-placeholder d-flex align-items-center justify-content-center text-gradient">
              <img src="ravi.jpeg" height="350px" alt="">
            </div>
          </div>

          <!-- Background Glow -->
          <div class="glow-effect"></div>
        </div>
      </div>
    </div>
  </div>
</section>
