<section class="skills-section py-5 bg-gradient-subtle">
  <div class="container">
    <div class="text-center mb-5" appScrollReveal="reveal-up">
      <h2 class="display-5 fw-bold mb-3">My <span class="text-gradient">Skills</span></h2>
      <div class="divider mx-auto"></div>
    </div>

    <div class="row g-4 mb-5">
      <div class="col-md-6 col-lg-3" *ngFor="let skill of skills; let i = index" appScrollReveal="reveal-up">
        <div class="skill-card glass-card text-center p-4 h-100" [style.transition-delay]="(i * 0.1) + 's'">
          <div class="circular-progress mb-3 mx-auto" [style.--progress]="skill.percent + '%'">
            <div class="inner-circle d-flex align-items-center justify-content-center">
              <span class="fs-4 fw-bold text-gradient">{{ skill.percent }}%</span>
            </div>
          </div>
          <h4 class="h5 fw-bold">{{ skill.name }}</h4>
        </div>
      </div>
    </div>

    <!-- Infinite Marquee -->
    <div class="marquee-container mt-5" appScrollReveal="reveal-up">
      <div class="marquee-content">
        <span class="marquee-item glass-card" *ngFor="let item of marqueeItems">{{ item }}</span>
        <!-- Duplicate for infinite effect -->
        <span class="marquee-item glass-card" *ngFor="let item of marqueeItems">{{ item }}</span>
      </div>
    </div>
  </div>
</section>
