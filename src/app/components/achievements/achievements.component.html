<section class="achievements-section py-5 bg-gradient-subtle">
  <div class="container">
    <div class="text-center mb-5" appScrollReveal="reveal-up">
      <h2 class="display-5 fw-bold mb-3">My <span class="text-gradient">Achievements</span></h2>
      <div class="divider mx-auto"></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let item of achievements; let i = index" 
           [appScrollReveal]="'reveal-up'">
        <div class="achievement-card glass-card p-4 text-center h-100" [style.transition-delay]="(i * 0.1) + 's'">
          <div class="achievement-icon mx-auto mb-4">
            <i class="bi {{ item.icon }}"></i>
          </div>
          <h3 class="h4 fw-bold mb-3">{{ item.title }}</h3>
          <p class="text-muted mb-0">{{ item.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
