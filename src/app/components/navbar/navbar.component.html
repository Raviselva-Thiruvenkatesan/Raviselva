<nav class="navbar" [ngClass]="{ 'scrolled': isScrolled() }" aria-label="Main navigation">
  <div class="container d-flex justify-content-between align-items-center">
    <!-- Logo -->
    <a routerLink="/" fragment="home" class="navbar-brand text-gradient" (click)="closeMenu()" aria-label="Raviselva T. – home">Raviselva T.</a>

    <!-- Desktop Menu -->
    <ul class="nav-menu d-none d-lg-flex align-items-center">
      <li *ngFor="let link of links">
        <a routerLink="/" [fragment]="link.id" class="nav-link"
          [class.active]="activeSection() === link.id"
          [attr.aria-current]="activeSection() === link.id ? 'location' : null">{{ link.label }}</a>
      </li>
      <li>
        <a routerLink="/blog" class="nav-link" [class.active]="activeSection() === 'blog'"
          [attr.aria-current]="activeSection() === 'blog' ? 'page' : null">Blog</a>
      </li>

      <!-- Theme Toggle -->
      <li class="ms-2">
        <button type="button" class="theme-toggle-btn" (click)="themeService.toggleTheme()"
          [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'">
          <i class="bi" aria-hidden="true" [ngClass]="themeService.isDarkMode() ? 'bi-moon-stars-fill' : 'bi-sun-fill'"></i>
        </button>
      </li>
    </ul>

    <!-- Mobile Menu Button -->
    <div class="d-flex align-items-center d-lg-none" style="z-index: 1001;">
      <button type="button" class="theme-toggle-btn me-3" (click)="themeService.toggleTheme()"
        [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme'">
        <i class="bi" aria-hidden="true" [ngClass]="themeService.isDarkMode() ? 'bi-moon-stars-fill' : 'bi-sun-fill'"></i>
      </button>
      <button type="button" class="hamburger" [ngClass]="{ 'active': isMenuOpen }" (click)="toggleMenu()"
        aria-controls="mobile-menu" [attr.aria-expanded]="isMenuOpen"
        [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="mobile-menu" [ngClass]="{ 'open': isMenuOpen }" [attr.inert]="isMenuOpen ? null : ''">
    <ul class="d-flex flex-column align-items-center justify-content-center h-100">
      <li *ngFor="let link of links">
        <a routerLink="/" [fragment]="link.id" class="nav-link" [class.active]="activeSection() === link.id"
          (click)="closeMenu()">{{ link.label }}</a>
      </li>
      <li>
        <a routerLink="/blog" class="nav-link" [class.active]="activeSection() === 'blog'" (click)="closeMenu()">Blog</a>
      </li>
    </ul>
  </div>
</nav>
