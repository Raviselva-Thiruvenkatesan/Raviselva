<section class="projects-section py-5">
  <div class="container">
    <div class="text-center mb-5" appScrollReveal="reveal-up">
      <h2 class="display-5 fw-bold mb-3">Featured <span class="text-gradient">Projects</span></h2>
      <div class="divider mx-auto"></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-4 col-md-6" *ngFor="let project of projects; let i = index" 
           [appScrollReveal]="'reveal-up'">
        <div class="project-card glass-card h-100 d-flex flex-column" [style.transition-delay]="(i * 0.1) + 's'">
          <!-- Project Image / Placeholder -->
          <div class="project-image position-relative {{ project.imageClass }}">
            <div class="overlay d-flex align-items-center justify-content-center">
              <a [href]="project.demoLink" class="btn-magnetic btn-primary-custom btn-sm me-2 text-white">
                <i class="bi bi-box-arrow-up-right me-1"></i> Demo
              </a>
              <a [href]="project.githubLink" class="btn-magnetic btn-outline-custom bg-white text-dark border-0 btn-sm">
                <i class="bi bi-github me-1"></i> Code
              </a>
            </div>
          </div>
          
          <!-- Project Info -->
          <div class="p-4 d-flex flex-column flex-grow-1">
            <h3 class="h5 fw-bold mb-3">{{ project.title }}</h3>
            <p class="text-muted text-sm mb-4 flex-grow-1" style="font-size: 0.95rem; line-height: 1.6;">
              {{ project.description }}
            </p>
            <div class="tech-stack d-flex flex-wrap gap-2 mt-auto">
              <span class="badge" *ngFor="let tech of project.tech">
                {{ tech }}
              </span>
            </div>
          </div>
          
          <div class="shiny-effect"></div>
        </div>
      </div>
    </div>
  </div>
</section>
