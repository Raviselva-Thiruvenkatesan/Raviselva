<section class="experience-section py-5">
  <div class="container">
    <div class="text-center mb-5" appScrollReveal="reveal-up">
      <h2 class="display-5 fw-bold mb-3">Work <span class="text-gradient">Experience</span></h2>
      <div class="divider mx-auto"></div>
    </div>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences; let i = index" 
           [appScrollReveal]="i % 2 === 0 ? 'reveal-left' : 'reveal-right'">
        <div class="timeline-dot">
          <i class="bi {{ exp.icon }}"></i>
        </div>
        <div class="timeline-content glass-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap">
            <h3 class="h5 fw-bold mb-0 text-gradient">{{ exp.title }}</h3>
            <span class="badge" style="background: rgba(139, 92, 246, 0.1); color: var(--purple); border: 1px solid rgba(139, 92, 246, 0.3);">
              {{ exp.date }}
            </span>
          </div>
          <h4 class="h6 text-muted mb-3">{{ exp.company }}</h4>
          <p class="mb-0 text-muted">{{ exp.description }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
